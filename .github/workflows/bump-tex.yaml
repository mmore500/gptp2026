name: Bump Tex Pin
on:
  workflow_dispatch:
jobs:
  bump-tex:
    name: Bump Tex Pin
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure on bump-tex-pin branch
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "bump-tex-pin" ]; then
            git fetch origin bump-tex-pin
            git checkout bump-tex-pin
            git submodule update --init --recursive
          fi
      - name: Bump tex submodule to latest
        run: |
          git submodule update --remote tex
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet tex; then
            echo "tex submodule already up to date, nothing to commit"
          else
            git add tex
            git commit -m "Bump tex pin"
            git push
          fi
