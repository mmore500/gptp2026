name: CI
on:
  push:
    branches: [ main, dev, paper ]
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# only one Pages deployment can be in flight at a time; without this,
# concurrent runs (e.g. several pushes to this PR in quick succession)
# each queue their own deploy-pages step and time out waiting on
# whichever run's deployment is currently active -- serialize instead,
# matching GitHub's own recommended pattern for Pages-deploying workflows
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  latex:
    name: Latex Build and Deploy
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/mmore500/teximage:sha-77b8179
      options: --user root
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Build LaTeX document
        run: |
          trap 'cat *.log || true >> "$GITHUB_OUTPUT"' EXIT
          make
      - name: Build supplement
        run: |
          trap 'cat tex/*.log || true >> "$GITHUB_OUTPUT"' EXIT
          cd tex && latexmk -pdf -interaction=nonstopmode -file-line-error ../supplement.tex
      - name: Build template zip
        run: make moreno-chapter.zip
      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp ${{ github.event.repository.name }}-draft.pdf deploy/
          cp tex/supplement.pdf deploy/${{ github.event.repository.name }}-supplement-draft.pdf
          echo '<html><body><p><a href="${{ github.event.repository.name }}-draft.pdf">Download Manuscript Draft [PDF]</a></p><p><a href="${{ github.event.repository.name }}-supplement-draft.pdf">Download Supplement Draft [PDF]</a></p></body></html>' > deploy/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: ${{ github.event.repository.name }}-draft.pdf
      - name: Upload supplement artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplement
          path: tex/supplement.pdf
      - name: Upload template zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-zip
          path: moreno-chapter.zip
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
